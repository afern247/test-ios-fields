<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auth Test</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f2f2f7;
            color: #1c1c1e;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .closeButton {
            position: absolute;
            top: 16px;
            right: 12px;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 18px;
            background: rgba(28, 28, 30, 0.86);
            color: #fff;
            font-size: 24px;
            line-height: 36px;
            padding: 0;
        }

        .card {
            position: relative;
            width: min(440px, 100%);
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 16px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }

        .group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0a84ff;
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
        }
    </style>
</head>
<body>
    <main class="card">
        <button class="closeButton" type="button" aria-label="Close" onclick="closeWebView()">x</button>
        <h1>Auth Test</h1>
        <form method="post" autocomplete="on">
            <div class="group">
                <label for="email">Email address</label>
                <input
                    inputmode="email"
                    id="email"
                    type="text"
                    required
                    autocomplete="email"
                    autocapitalize="none"
                    spellcheck="false"
                    name="email"
                    value=""
                >
            </div>

            <div class="group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    required
                    autocomplete="new-password"
                    autocapitalize="none"
                    spellcheck="false"
                    name="password"
                >
            </div>
        </form>
    </main>

    <script>
        function closeWebView() {
            if (window.webkit?.messageHandlers?.closeWebView) {
                window.webkit.messageHandlers.closeWebView.postMessage("close");
            }
        }
    </script>
</body>
</html>
