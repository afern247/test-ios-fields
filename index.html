<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auth Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
        <button class="closeButton" type="button" aria-label="Close" onclick="closeWebView()">x</button>
        <h1>Profile autofill Test</h1>

        <form method="post" autocomplete="on">
            <label for="email">Email address</label>
            <input
                id="email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                autocapitalize="none"
                spellcheck="false"
                placeholder="name@email.com"
                enterkeyhint="next"
                required
            >
        </form>
    </main>
 

    <script>
        function closeWebView() {
            if (window.webkit?.messageHandlers?.closeWebView) {
                window.webkit.messageHandlers.closeWebView.postMessage("close");
            }
        }
    </script>
</body>
</html>
